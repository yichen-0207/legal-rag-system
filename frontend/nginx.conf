# ===== IP 限流（防单脚本刷量，超限返回 429）=====
# api 档：检索/列表/统计等读接口，速率宽松，页面一次性并发加载不会误伤；
# llm 档：问答/深度模式/解读/追问等烧 token 的端点，独立 zone 计数、与 api 档互不挤占。
# limit_req 只管准入速率：已建立的 SSE 流式连接不受影响，不会掐断进行中的回答；
# 真正的总量成本上限需账号配额（已入待办）或每日 token 预算，限流只防突发刷量。
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=llm:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 前端仍在持续迭代：强制浏览器每次向服务器校验（带 ETag/Last-Modified，
        # 文件未改动时返回 304，开销可忽略）。否则浏览器对无 Cache-Control 的
        # 静态资源使用启发式缓存，改了 JS 却仍执行旧副本，表现为「改了没效果」。
        add_header Cache-Control "no-cache";
    }

    # API 反向代理到后端
    location /api/ {
        # 普通接口限流档（burst 瞬时给满后按 20r/s 回填，nodelay 不排队直接放行/拒绝）
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（流式问答）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ---- LLM 重端点：独立 llm 档限流（平级 location，最长前缀优先匹配） ----
    # 必须与 /api/ 平级并各自携带完整 proxy 配置：实测（nginx 1.31.3）嵌套在 /api/
    # 内部的 location 不会继承父级 proxy_pass，请求会落到静态默认 root 返回 404/405。
    # 每块重复 proxy 配置是为换取行为确定性，勿改为嵌套写法。
    location /api/v1/qa/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location /api/v1/agent/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location /api/v1/structured-analysis/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location /api/v1/topic-analysis/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    # 图谱问答的两次实现都含 LLM 调用：精确匹配优先于 /api/ 前缀，落入 llm 档
    location = /api/v1/kg/reasoning-qa {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location = /api/v1/kg/multihop-qa {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}