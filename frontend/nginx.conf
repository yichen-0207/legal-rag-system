# ===== IP 限流（防单脚本刷量，超限返回 429）=====
# api 档：检索/列表/统计等读接口，速率宽松，页面一次性并发加载不会误伤；
# llm 档：问答/深度模式/解读/追问等烧 token 的端点，独立 zone 计数、与 api 档互不挤占。
# limit_req 只管准入速率：已建立的 SSE 流式连接不受影响，不会掐断进行中的回答；
# 真正的总量成本上限需账号配额（已入待办）或每日 token 预算，限流只防突发刷量。
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=llm:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name localhost;

    # 健康探针：必须精确匹配，才能在收紧兜底后仍然可用。
    # 背景：上一轮把静态兜底改成「非 / 一律 404」后，/health 与 /health/ready 从 3000
    # 端口变成了 404，外部探活（脚本/监控）会误报宕机。这里只放行这两个确切路径，
    # 其余路径（/healthx、/random-path 等）仍然走 location / 的 404 分支。
    location = /health {
        proxy_pass http://legal-backend:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health/ready {
        proxy_pass http://legal-backend:8001/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端静态文件
    # 前端是 hash 路由（#/dashboard），真实路径只有 /，不需要把任意路径回退到 index.html。
    # try_files 只兜底目录索引（/ → index.html），其余不存在的路径一律 404。
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        # 不存在的路径返回纯文本 404，避免把 SPA 壳（200 + HTML）返回给 /sw.js、/health
        # 这类探测请求，让误配/探测能立刻暴露。
        error_page 404 @plain404;

        # 前端仍在持续迭代：强制浏览器每次向服务器校验（带 ETag/Last-Modified，
        # 文件未改动时返回 304，开销可忽略）。否则浏览器对无 Cache-Control 的
        # 静态资源使用启发式缓存，改了 JS 却仍执行旧副本，表现为「改了没效果」。
        add_header Cache-Control "no-cache";
    }

    # 纯文本 404（不返回 HTML）。只作用于静态资源命中失败的请求；
    # /api/ 的 404 由后端返回 JSON，nginx 的 proxy_intercept_errors 默认关闭，不受影响。
    # types {} 清空本 location 的「扩展名 → MIME」映射表，否则 nginx 仍会按原 URI 的
    # 扩展名推导 Content-Type（实测 /sw.js 的 404 被标成 application/javascript），
    # 清空后统一落到 default_type。
    location @plain404 {
        types { }
        default_type text/plain;
        return 404 "404 Not Found";
    }

    # API 反向代理到后端
    location /api/ {
        # 普通接口限流档（burst 瞬时给满后按 20r/s 回填，nodelay 不排队直接放行/拒绝）
        limit_req zone=api burst=40 nodelay;

        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持（流式问答）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    # ---- LLM 重端点：独立 llm 档限流（平级 location，最长前缀优先匹配） ----
    # 必须与 /api/ 平级并各自携带完整 proxy 配置：实测（nginx 1.31.3）嵌套在 /api/
    # 内部的 location 不会继承父级 proxy_pass，请求会落到静态默认 root 返回 404/405。
    # 每块重复 proxy 配置是为换取行为确定性，勿改为嵌套写法。
    location /api/v1/qa/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location /api/v1/agent/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location /api/v1/structured-analysis/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location /api/v1/topic-analysis/ {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    # 图谱问答的两次实现都含 LLM 调用：精确匹配优先于 /api/ 前缀，落入 llm 档
    location = /api/v1/kg/reasoning-qa {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
    location = /api/v1/kg/multihop-qa {
        limit_req zone=llm burst=8 nodelay;
        proxy_pass http://legal-backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}