name: legal-rag-platform

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: legal-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    image: legal-rag-backend:latest
    build: .
    container_name: legal-backend
    mem_limit: 10g
    mem_reservation: 3g
    restart: always
    ports:
      - "8001:8001"
    environment:
      - LEGAL_ES_HOSTS=["http://elasticsearch:9200"]
      - LEGAL_ES_USER=elastic
      - LEGAL_ES_PASSWORD=${LEGAL_ES_PASSWORD}
      - LEGAL_LLM_API_KEY=${LEGAL_LLM_API_KEY}
      - LEGAL_LLM_API_BASE_URL=https://api.deepseek.com/v1
      - LEGAL_LLM_MODEL=deepseek-flash
      - LEGAL_LLM_DEEPSEEK_API_KEY=${LEGAL_DEEPSEEK_API_KEY}
      - LEGAL_ADMIN_TOKEN=${LEGAL_ADMIN_TOKEN:-dev_admin_token_change_me}
      - LEGAL_EMBEDDING_MODEL=/models/bge-m3
      - LEGAL_RERANKER_MODEL=/models/bge-reranker-v2-m3
      # CPU 推理性能参数（可按部署机器调整，无需改代码）
      - LEGAL_TORCH_NUM_THREADS=${LEGAL_TORCH_NUM_THREADS:-8}
      - LEGAL_RERANKER_BATCH_SIZE=${LEGAL_RERANKER_BATCH_SIZE:-8}
      # 两阶段精排窗口（只对 RRF 前 N 条跑 cross-encoder，其余按 RRF 顺序拼接）
      - LEGAL_RERANKER_WINDOW=${LEGAL_RERANKER_WINDOW:-20}
      # 实体消歧 L3 向量对齐（变体兜底，配合数字/编辑距离/长度三重守卫）
      - LEGAL_ENTITY_ALIGN_ENABLED=${LEGAL_ENTITY_ALIGN_ENABLED:-true}
      - LEGAL_ENTITY_ALIGN_THRESHOLD=${LEGAL_ENTITY_ALIGN_THRESHOLD:-0.95}
      # 批次内部两两比对：根治「同一批次首次共同出现的變体」被写成两条文档
      - LEGAL_ENTITY_ALIGN_INTRA_BATCH=${LEGAL_ENTITY_ALIGN_INTRA_BATCH:-true}
      - TOKENIZERS_PARALLELISM=false
    volumes:
      # 挂载本地 ML 模型（避免在容器内下载）
      # 模型目录由 .env 的 LEGAL_MODELS_DIR 指定，默认项目内 ./models
      - ${LEGAL_MODELS_DIR:-./models}/bge-m3:/models/bge-m3:ro
      - ${LEGAL_MODELS_DIR:-./models}/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
      # 挂载后端源码：改代码后重启容器即可生效，无需重建镜像
      - ./legal_rag:/app
      # 挂载法规数据
      # data/raw 必须可写：管理端新增/修改/删除法规会写入该目录（含新建法域子目录）
      - ./legal_rag/data/raw:/app/data/raw:rw
      - ./legal_rag/data/law_catalog.json:/app/data/law_catalog.json
      - ./legal_rag/data/taxonomy_merged.json:/app/data/taxonomy_merged.json:ro
    # 就绪探针：打 /health/ready（模型加载完成后才 200，预热期间 503）。
    # 不用 /health：那个只要进程活着就返回 200，无法反映"能不能高效服务"。
    # 镜像基于 python:3.10-slim，没有 curl，故用 python 发起请求。
    # start_period 给足模型预热时间（bge-m3 冷加载实测约 60s），期间的失败不计入 retries。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              code = urllib.request.urlopen("http://127.0.0.1:8001/health/ready", timeout=4).status
          except Exception:
              code = 0
          sys.exit(0 if code == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: legal-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 等后端"就绪"而非"启动"：否则前端容器会在后端模型仍在预热时就绪，
    # 用户此时打开页面发起的检索会排在模型加载后面长时间等待。
    depends_on:
      backend:
        condition: service_healthy

volumes:
  es_data:
    name: es_data
    external: true