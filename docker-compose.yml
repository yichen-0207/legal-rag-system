name: legal-rag-platform

services:
  elasticsearch:
    image: elasticsearch:8.11.0
    build:
      context: .
      dockerfile: Dockerfile.es
    container_name: legal-es
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - cluster.routing.allocation.disk.threshold_enabled=false
    # 只绑定宿主机回环地址：ES 关闭了安全认证，绑定全网等于局域网裸奔。
    # 后端容器走 compose 内部网络（elasticsearch:9200）与端口映射无关；
    # 宿主机脚本（评测/排查）走 localhost:9200 不受影响（与后端 8001 同策略）。
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    image: legal-rag-backend:latest
    build: .
    container_name: legal-backend
    mem_limit: 10g
    mem_reservation: 3g
    restart: always
    # 只绑定宿主机回环地址，不对外暴露后端端口：
    # 对外入口只有 nginx（3000），后端不再能被局域网/外部直连，符合「不暴露接口」。
    # 之所以保留映射而非整条删除，是因为本机验收流程（见《优化说明与人工测试方案.md》）
    # 与就绪探针巡检都直连 localhost:8001，且 nginx 当前未配置 /health/ 路由，
    # 删掉映射会让这些已文档化的步骤失效。绑定回环即可两者兼顾。
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - LEGAL_ES_HOSTS=["http://elasticsearch:9200"]
      - LEGAL_ES_USER=elastic
      - LEGAL_ES_PASSWORD=${LEGAL_ES_PASSWORD}
      - LEGAL_LLM_API_KEY=${LEGAL_LLM_API_KEY}
      - LEGAL_LLM_API_BASE_URL=https://api.deepseek.com/v1
      - LEGAL_LLM_MODEL=deepseek-flash
      - LEGAL_LLM_DEEPSEEK_API_KEY=${LEGAL_DEEPSEEK_API_KEY}
      # LLM 用量账本：本地落盘，零外发；/app/logs 经源码挂载落到宿主 legal_rag/logs
      - LEGAL_LLM_USAGE_LOG_ENABLED=${LEGAL_LLM_USAGE_LOG_ENABLED:-true}
      - LEGAL_LLM_USAGE_LOG_DIR=${LEGAL_LLM_USAGE_LOG_DIR:-/app/logs}
      - LEGAL_ADMIN_TOKEN=${LEGAL_ADMIN_TOKEN:-dev_admin_token_change_me}
      # 数据目录：管理端写入 /app/data/raw（原始语料）；入库扫描 /app/data/raw_v2（阶段 1 清洗产物）
      - LEGAL_DATA_DIR=/app/data/raw
      - LEGAL_INGEST_DATA_DIR=/app/data/raw_v2
      - LEGAL_EMBEDDING_MODEL=/models/bge-m3
      - LEGAL_RERANKER_MODEL=/models/bge-reranker-v2-m3
      # CPU 推理性能参数（可按部署机器调整，无需改代码）
      - LEGAL_TORCH_NUM_THREADS=${LEGAL_TORCH_NUM_THREADS:-8}
      - LEGAL_RERANKER_BATCH_SIZE=${LEGAL_RERANKER_BATCH_SIZE:-8}
      # OpenMP 线程与自旋。这些变量由 OpenMP 运行时在「首次并行区」初始化时读取，
      # 必须在进程启动前注入：代码里 import torch 之后再 os.environ.setdefault 已无效。
      # PASSIVE + SPINCOUNT=0 让空闲线程睡眠而非空转，避免过度订阅时白烧 CPU。
      - OMP_NUM_THREADS=${LEGAL_TORCH_NUM_THREADS:-8}
      - MKL_NUM_THREADS=${LEGAL_TORCH_NUM_THREADS:-8}
      - OMP_WAIT_POLICY=PASSIVE
      - GOMP_SPINCOUNT=0
      # 两阶段精排窗口（只对 RRF 前 N 条跑 cross-encoder，其余按 RRF 顺序拼接）
      - LEGAL_RERANKER_WINDOW=${LEGAL_RERANKER_WINDOW:-20}
      # 实体消歧 L3 向量对齐（变体兜底，配合数字/编辑距离/长度三重守卫）
      - LEGAL_ENTITY_ALIGN_ENABLED=${LEGAL_ENTITY_ALIGN_ENABLED:-true}
      - LEGAL_ENTITY_ALIGN_THRESHOLD=${LEGAL_ENTITY_ALIGN_THRESHOLD:-0.95}
      # 批次内部两两比对：根治「同一批次首次共同出现的變体」被写成两条文档
      - LEGAL_ENTITY_ALIGN_INTRA_BATCH=${LEGAL_ENTITY_ALIGN_INTRA_BATCH:-true}
      # 问答检索召回通道：纯向量 + BM25 混合召回（RRF 融合），提升字面命中类查询的召回
      - LEGAL_QA_HYBRID_ENABLED=${LEGAL_QA_HYBRID_ENABLED:-true}
      - LEGAL_QA_HYBRID_RRF_K=${LEGAL_QA_HYBRID_RRF_K:-60}
      - LEGAL_QA_HYBRID_BM25_ONLY_SIMILARITY=${LEGAL_QA_HYBRID_BM25_ONLY_SIMILARITY:-0.5}
      # Agent（迭代式工具调用问答）：启用；配合复杂度路由，简单/定向查询自动走快速 RAG。
      # 关闭时 /api/v1/agent/stream 自动降级为既有 RAG 链路。
      - LEGAL_AGENT_ENABLED=${LEGAL_AGENT_ENABLED:-true}
      - LEGAL_AGENT_MAX_STEPS=${LEGAL_AGENT_MAX_STEPS:-5}
      # 工具调用预算与停滞短路阈值：共同决定探索轮次上界与「低效重复」的提前收口点。
      # 预算 6 = 首轮多法域扇出（≤4）+ 反思补证（≤2）；须与 core/config.py 默认值保持
      # 一致——本环境变量优先级高于 config.py，两处不一致时以本处为生效值。
      - LEGAL_AGENT_MAX_TOOL_CALLS=${LEGAL_AGENT_MAX_TOOL_CALLS:-6}
      - LEGAL_AGENT_MAX_STAGNANT_STEPS=${LEGAL_AGENT_MAX_STAGNANT_STEPS:-2}
      # 证据收口送精排的候选上限（先收敛再精排，直接决定收口耗时）
      - LEGAL_AGENT_FINALIZE_MAX_CANDIDATES=${LEGAL_AGENT_FINALIZE_MAX_CANDIDATES:-12}
      # 最终送入 LLM 的证据条数（需大于 top_k，否则多步额外召回被截掉）
      - LEGAL_AGENT_FINALIZE_PASS_K=${LEGAL_AGENT_FINALIZE_PASS_K:-8}
      # 复杂度路由：开启后仅复杂查询走多步探索，简单/定向查询走既有快速 RAG
      - LEGAL_AGENT_COMPLEXITY_ROUTING_ENABLED=${LEGAL_AGENT_COMPLEXITY_ROUTING_ENABLED:-true}
      - LEGAL_AGENT_MIN_QUERY_LEN=${LEGAL_AGENT_MIN_QUERY_LEN:-12}
      - LEGAL_AGENT_CONJUNCTION_MIN_LEN=${LEGAL_AGENT_CONJUNCTION_MIN_LEN:-15}
      # 自适应分流（灰区探测）：实测区分度不足，默认关闭；开启会多付一次向量检索成本
      - LEGAL_AGENT_PROBE_ENABLED=${LEGAL_AGENT_PROBE_ENABLED:-false}
      - LEGAL_AGENT_PROBE_MIN_SIMILARITY=${LEGAL_AGENT_PROBE_MIN_SIMILARITY:-0.7}
      - LEGAL_AGENT_PROBE_MIN_RESULTS=${LEGAL_AGENT_PROBE_MIN_RESULTS:-2}
      - TOKENIZERS_PARALLELISM=false
    volumes:
      # 挂载本地 ML 模型（避免在容器内下载）
      # 模型目录由 .env 的 LEGAL_MODELS_DIR 指定，默认项目内 ./models
      - ${LEGAL_MODELS_DIR:-./models}/bge-m3:/models/bge-m3:ro
      - ${LEGAL_MODELS_DIR:-./models}/bge-reranker-v2-m3:/models/bge-reranker-v2-m3:ro
      # 挂载后端源码：改代码后重启容器即可生效，无需重建镜像
      - ./legal_rag:/app
      # 挂载法规数据
      # data/raw 必须可写：管理端新增/修改/删除法规会写入该目录（含新建法域子目录）
      - ./legal_rag/data/raw:/app/data/raw:rw
      - ./legal_rag/data/law_catalog.json:/app/data/law_catalog.json
      - ./legal_rag/data/taxonomy_merged.json:/app/data/taxonomy_merged.json:ro
    # 就绪探针：打 /health/ready（模型加载完成后才 200，预热期间 503）。
    # 不用 /health：那个只要进程活着就返回 200，无法反映"能不能高效服务"。
    # 镜像基于 python:3.10-slim，没有 curl，故用 python 发起请求。
    # start_period 给足模型预热时间（bge-m3 冷加载实测约 60s），期间的失败不计入 retries。
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              code = urllib.request.urlopen("http://127.0.0.1:8001/health/ready", timeout=4).status
          except Exception:
              code = 0
          sys.exit(0 if code == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      elasticsearch:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: legal-frontend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # 等后端"就绪"而非"启动"：否则前端容器会在后端模型仍在预热时就绪，
    # 用户此时打开页面发起的检索会排在模型加载后面长时间等待。
    depends_on:
      backend:
        condition: service_healthy

volumes:
  es_data:
    name: es_data
    external: true